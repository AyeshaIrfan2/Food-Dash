<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
     <meta name="color-scheme" content="light" />
    <title>Sign Up</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="assests/css/sign-up.css" />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col-lg-6 p-0 d-none d-lg-block ">
            <img class="img-fluid main-img" src="assests/images/login/login-img.png" alt="">
        </div>
        <div class="col-lg-6 col-12 login">
            <img class="brand-logo" src="assests/images/logo.png" alt="">
            <div class="h-heading ">Create Account</div>
            <div>
                <div class="h-text">Username</div>
                <input class="h-input" type="text" placeholder="Enter your username">
            </div>
            <div>
                <div class="h-text">Email Address</div>
                <input class="h-input" type="email" placeholder="Youraddres@email.com">
            </div>
            <div>
                <div class="h-text">Password</div>
                <input class="h-input" type="password" placeholder="Enter your password">
            </div>
            <div class="d-grid gap-2 col-lg-6 col-10 mx-auto">
                <a class=" btn btn-anchor" href="index.html">Login to Continue</a>
            </div>
            <div class="login-text">Already have an account ? <a href="login.html">Log in</a></div>
            <div class="login-subtext">Already have an account? Log in</div>
            <div class="buttons">
            <button class="btn btn-outline-secondary px-3 py-2">
              <img
                class="img-login"
                src="assests/images/icons-1/google.png"
                alt=""
              />
              Login with Google
            </button>
            <button class="btn btn-outline-secondary px-3 py-2">
              <img
                class="img-login"
                src="assests/images/icons-1/facebook.png"
                alt=""
              />
              Login with Facebook
            </button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
