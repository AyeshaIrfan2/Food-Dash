<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Food Dash</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="assests/css/style.css" />
  </head>
  <body>
    <header class="bg-header">
      <!-- <nav class="d-flex justify-content-between align-items-center py-3 px-5">
        <img src="assests/images/logo.png" alt="" />
        <a class="" href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">Offers</a>
        <a href="#">Service</a>
        <a href="#">About</a>
        <img src="assests/images/icons2.png" alt="" />
      </nav> -->
    </header>

    <main>
      <div class="bg-header">
        <div class="container">
          <div class="row">
            <div class="col-6 d-flex flex-column justify-content-center gap-3">
              <div class="bg-heading">
                <span>Quick</span> and <span>Tasty Food Delivered </span>with
                <span>a Dash of </span> Speed
              </div>
              <button class="btn btn-primary rounded-pill btn-order-now">
                Order Now
              </button>
              <button
                class="btn btn-outline-primary rounded-pill btn-track-order"
              >
                Track Order
              </button>
            </div>
            <div class="col-6">
              <img class="img-fluid" src="assests/images/header.png" alt="" />
            </div>
            <!-- row2 -->
            <div class="bg-white shadow rounded-4 p-3 position-absolute top-100 start-50 translate-middle">
              <div class="row">
                <div class="col-4 d-flex align-items-center gap-3">
                  <img
                    class="icons"
                    src="assests/images/icons/fast-delivery 1.png"
                    alt=""
                  />
                  <div>
                    <div class="d-box-heading">Fast Delivery</div>
                    <div class="d-box-subheading">
                      Promise To Deliver Within 30 Mins
                    </div>
                  </div>
                </div>
                <div class="col-4 d-flex align-items-center gap-3">
                  <img
                    class="icons"
                    src="assests/images/icons/fresh.png"
                    alt=""
                  />
                  <div>
                    <div class="d-box-heading">Fresh Food</div>
                    <div class="d-box-subheading">
                      Your Food Will Be Delivered 100% Fresh To Your Home.
                    </div>
                  </div>
                </div>
                <div class="col-4 d-flex align-items-center gap-3">
                  <img
                    class="icons"
                    src="assests/images/icons/box 1.png"
                    alt=""
                  />
                  <div>
                    <div class="d-box-heading">Free Delivery</div>
                    <div class="d-box-subheading">
                      Your Food Delivery Is Absolutely Free. No Cost Just Order
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer></footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
