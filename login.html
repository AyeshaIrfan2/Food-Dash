<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Food Dash - Log In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="assests/css/login.css" />
</head>

<body>
  <div class="container-fluid p-0">
    <div class="row g-0 min-vh-100">
      <div class="col-lg-6 p-0 d-none d-lg-block">
        <img class="img-fluid main-img" src="assests/images/login/login-img.png" alt="Food Dash Delivery Illustration" />
      </div>
      <div class="col-lg-6 col-12 login">
        <div>
          <a href="index.html" title="Back to Home">
            <img class="brand-logo" src="assests/images/logo.png" alt="Food Dash Logo" />
          </a>
        </div>
        <div class="h-heading">Login to your account!</div>
        <div class="buttons">
          <button type="button" class="btn btn-outline-secondary px-3 py-2 d-inline-flex align-items-center justify-content-center">
            <img class="img-login" src="assests/images/icons-1/google.png" alt="Google Logo" />
            Login with Google
          </button>
          <button type="button" class="btn btn-outline-secondary px-3 py-2 d-inline-flex align-items-center justify-content-center">
            <img class="img-login" src="assests/images/icons-1/facebook.png" alt="Facebook Logo" />
            Login with Facebook
          </button>
        </div>

        <form action="index.html" method="GET" class="mt-2">
          <div>
            <div class="h-text">Email Address</div>
            <input class="h-input" type="email" placeholder="Enter Your Email:" required />
          </div>
          <div>
            <div class="h-text">Password</div>
            <input class="h-input" type="password" placeholder="Enter Password" required />
          </div>

          <div class="d-grid gap-2 col-lg-8 col-12 mt-4">
            <a class="btn btn-anchor text-center py-2 fs-6 fw-bold" href="index.html">Login to Continue</a>
          </div>
        </form>

        <div class="sign-up-text mt-4">
          Don’t have an account ? <a href="sign-up.html">Sign up</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="assests/js/main.js"></script>
</body>

</html>
